<svg viewBox="20 20 970 500" width="970" height="500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="결제 한도 서버 구조: 요청자가 결제 컨트롤러를 호출하면 서비스 계층이 수수료 정책과 수정 금지 한도 저장소를 사용해 처리한다">
<title>결제 서버 구조</title>
<desc>요청을 보내는 쪽 → 결제 컨트롤러(TODO, 직접 구현) → 서비스 계층(직접 추가) → 수수료 정책(리팩토링 대상) / 한도 저장소(수정 금지, 호출마다 지연).</desc>
<rect width="1010" height="520" fill="#ffffff"/>

<defs>
  <marker id="pa-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
  <marker id="pa-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="pa-arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
  </marker>
</defs>

<!-- 서버 컨테이너 -->
<rect x="260" y="40" width="460" height="300" rx="14" fill="#fbfbfc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="490" y="65" text-anchor="middle" font-size="15" font-weight="700" fill="#334155" font-family="sans-serif">완성할 서버 (:8080)</text>

<!-- 요청자 -->
<rect x="30" y="130" width="180" height="120" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
<text text-anchor="middle" font-family="sans-serif" fill="#312e81">
  <tspan x="120" y="185" font-size="14" font-weight="700">요청을 보내는 쪽</tspan>
  <tspan x="120" y="207" font-size="12">(curl, HTTP Client)</tspan>
</text>

<!-- 컨트롤러 (TODO, 직접 구현: 파란색) -->
<rect x="290" y="90" width="200" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text text-anchor="middle" font-family="sans-serif" fill="#1e3a8a">
  <tspan x="390" y="115" font-size="14" font-weight="700">결제 컨트롤러</tspan>
  <tspan x="390" y="133" font-size="11">(TODO, 직접 구현)</tspan>
</text>

<!-- 서비스 계층 (직접 추가: 파란색) -->
<rect x="290" y="180" width="200" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text text-anchor="middle" font-family="sans-serif" fill="#1e3a8a">
  <tspan x="390" y="205" font-size="14" font-weight="700">서비스 계층</tspan>
  <tspan x="390" y="223" font-size="11">(직접 추가)</tspan>
</text>

<!-- 수수료 정책 (리팩토링 대상: 주황색) -->
<rect x="290" y="270" width="200" height="55" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
<text text-anchor="middle" font-family="sans-serif" fill="#7c2d12">
  <tspan x="390" y="293" font-size="14" font-weight="700">수수료 정책</tspan>
  <tspan x="390" y="310" font-size="11">(기존 코드 리팩토링)</tspan>
</text>

<!-- 한도 저장소 (수정 금지: 회색), 서버 컨테이너 밖 오른쪽 -->
<rect x="540" y="390" width="220" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text text-anchor="middle" font-family="sans-serif" fill="#334155">
  <tspan x="650" y="415" font-size="14" font-weight="700">한도 저장소</tspan>
  <tspan x="650" y="433" font-size="11">(수정 금지)</tspan>
  <tspan x="650" y="452" font-size="11">사용액 읽기 / 쓰기</tspan>
  <tspan x="650" y="468" font-size="11">결제 기록 조회 / 저장</tspan>
  <tspan x="650" y="486" font-size="11" fill="#b45309">호출마다 50~150ms 지연</tspan>
</text>

<!-- 화살표 -->
<line x1="210" y1="150" x2="288" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#pa-arrow-blue)"/>
<text x="215" y="98" text-anchor="start" font-size="11" fill="#1d4ed8" font-family="sans-serif">POST /api/v1/payments 등</text>

<line x1="390" y1="150" x2="390" y2="178" stroke="#2563eb" stroke-width="2" marker-end="url(#pa-arrow-blue)"/>

<line x1="390" y1="240" x2="390" y2="268" stroke="#ea580c" stroke-width="1.8" marker-end="url(#pa-arrow-orange)"/>
<text x="460" y="258" text-anchor="middle" font-size="11" fill="#c2410c" font-family="sans-serif">수수료 계산</text>

<path d="M490,215 L650,215 L650,388" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#pa-arrow-gray)"/>
<text x="660" y="300" font-size="11" fill="#334155" font-family="sans-serif">사용액 읽기 → 판단 → 쓰기</text>
<text x="660" y="316" font-size="11" fill="#334155" font-family="sans-serif">(이 구간에 다른 요청이</text>
<text x="660" y="332" font-size="11" fill="#334155" font-family="sans-serif">끼어들지 않게 처리해야 합니다)</text>

<!-- 범례 -->
<rect x="30" y="440" width="14" height="14" fill="#dbeafe" stroke="#3b82f6"/>
<text x="50" y="451" font-size="12" fill="#334155" font-family="sans-serif">직접 구현하거나 추가하는 부분</text>
<rect x="30" y="465" width="14" height="14" fill="#ffedd5" stroke="#f97316"/>
<text x="50" y="476" font-size="12" fill="#334155" font-family="sans-serif">리팩토링 대상 (표 기준으로 다시 작성)</text>
<rect x="30" y="490" width="14" height="14" fill="#f1f5f9" stroke="#64748b"/>
<text x="50" y="501" font-size="12" fill="#334155" font-family="sans-serif">수정 금지 (그대로 사용)</text>
</svg>
